# Username/password student login (v3.0) — Node suites + provisioning E2E.
#
# Two jobs:
#   1. node-suites      — the pure-Node suites (no emulator, no Java):
#                         identity mapping, provisioning planner, temp-password
#                         generator, Firestore data-layer orchestration.
#   2. provisioning-e2e — the provisioning tool + username login run END TO END
#                         against the Firebase Auth + Firestore EMULATORS with
#                         firebase-admin (a non-production environment: no real
#                         project, no real accounts, no real credentials).
name: Username login (v3.0)

on:
  push:
    branches: [ main, "arena/**" ]
    paths:
      - "mobile/**"
      - "tools/**"
      - "docs/**"
      - "firebase/**"
      - ".github/workflows/username-login.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "tools/**"
      - "docs/**"
      - "firebase/**"
      - ".github/workflows/username-login.yml"
  workflow_dispatch:

jobs:
  node-suites:
    name: Node suites (identity · provisioning plan · accounting · data layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Identity mapping (username ↔ internal identifier)
        working-directory: mobile
        run: node test/identity.test.js
      - name: Accounting core (paise math)
        working-directory: mobile
        run: node test/accounting.test.js
      - name: Data layer + username login (mock Firestore/Auth)
        working-directory: mobile
        run: node test/api.mock.test.js
      - name: Provisioning planner (roster, collisions, ambiguity, safety gates)
        working-directory: tools/provision
        run: node test/plan.test.js
      - name: Temporary passwords + credentials file (CSPRNG, 0600, no overwrite)
        working-directory: tools/provision
        run: node test/passwords.test.js
      - name: Archived legacy API cannot start with default secrets (regression guard)
        working-directory: archive/legacy-express-web/backend
        run: npm ci --no-audit --no-fund
      - name: Archived legacy API hardening
        working-directory: archive/legacy-express-web
        run: node test/legacy-hardening.test.js

  provisioning-e2e:
    name: Provisioning + login E2E (Auth + Firestore emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            tools/provision/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Cache emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/package.json', 'tools/provision/package.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Install test dependencies (rules-unit-testing)
        working-directory: firebase
        run: npm ci
      - name: Install provisioning dependencies (firebase-admin)
        working-directory: tools/provision
        run: npm ci
      - name: Run the provisioning + login E2E suite
        working-directory: firebase
        run: |
          firebase emulators:exec --project jkss-fund-e2e --only firestore,auth \
            "node ../tools/provision/test/emulator.test.js" \
            > provision-output.txt 2>&1 || true
          echo "::error title=provision-output::captured $(wc -c < provision-output.txt 2>/dev/null || echo '?') bytes"
          {
            echo '## Provisioning + login E2E output'
            echo '```'
            cat provision-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^[0-9]+ passed, 0 failed' provision-output.txt; then
            SUMMARY=$(grep -E '[0-9]+ passed' provision-output.txt | tail -1)
            FAILS=$(grep -A2 -E '^  FAIL' provision-output.txt | grep -vE '^\[2|^--$|^ *$' | head -c 4800 | tr '\n' '|')
            echo "::error title=provision-output::FAILED — ${SUMMARY} Failures: ${FAILS}"
            exit 1
          fi
      - name: Upload full E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-e2e-output
          path: firebase/provision-output.txt
          if-no-files-found: ignore
