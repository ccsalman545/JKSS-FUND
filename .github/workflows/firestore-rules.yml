# Runs the Firestore security-rules test suite against the real Firestore
# emulator (production rules engine) on every push/PR that touches firebase/.
# GitHub-hosted runners ship with Java 17, so the emulator runs here.
name: Firestore rules

on:
  push:
    branches: [ main, "arena/**" ]
    paths:
      - "firebase/**"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firestore-rules.yml"

jobs:
  rules:
    name: Rules unit tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('firebase/package.json') }}
          restore-keys: firestore-emulator-${{ runner.os }}-
      - name: Install test dependencies
        working-directory: firebase
        run: npm ci
      - name: Run rules tests in the Firestore emulator
        working-directory: firebase
        run: |
          firebase emulators:exec --project jkss-fund-local --only firestore "node test/rules.test.js" \
            > rules-test-output.txt 2>&1 || true
          echo "::error title=rules-output::captured output: $(wc -c < rules-test-output.txt 2>/dev/null || echo '?') bytes"
          {
            echo '## Firestore rules test output'
            echo '```'
            cat rules-test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^[0-9]+ passed, 0 failed' rules-test-output.txt; then
            # Compact single-line annotation (newlines as '|'): summary
            # counts + every failed scenario + the first error lines, so
            # failures are readable without raw-log access.
            SUMMARY=$(grep -E '^[0-9]+ passed' rules-test-output.txt | tr '\n' ' ')
            FAILS=$(grep -E '^FAIL|FATAL|Error compiling|PERMISSION_DENIED|maximum of 1000' rules-test-output.txt | head -c 5000 | tr '\n' '|')
            echo "::error title=rules-output::FAILED — ${SUMMARY} Failed scenarios: ${FAILS}"
            exit 1
          fi
      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-test-output
          path: firebase/rules-test-output.txt
          if-no-files-found: ignore

  accounting:
    name: Accounting + api orchestration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run accounting core tests
        working-directory: mobile
        run: node test/accounting.test.js
      - name: Run api orchestration tests (mock Firestore)
        working-directory: mobile
        run: node test/api.mock.test.js
