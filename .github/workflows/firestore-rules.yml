# Runs the Firestore security-rules test suite against the real Firestore
# emulator (production rules engine) on every push/PR that touches firebase/.
# GitHub-hosted runners ship with Java 17, so the emulator runs here.
name: Firestore rules

on:
  push:
    branches: [ main, "arena/**" ]
    paths:
      - "firebase/**"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firestore-rules.yml"

jobs:
  rules:
    name: Rules unit tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install test dependencies
        working-directory: firebase
        run: npm ci
      - name: Run rules tests in the Firestore emulator
        working-directory: firebase
        run: |
          echo "::notice title=rules-step::step shell started"
          # Capture everything (steps run under bash -e, so survive failure
          # with `|| true` and re-fail explicitly after reporting).
          firebase emulators:exec --only firestore "node test/rules.test.js" \
            > rules-test-output.txt 2>&1 || true
          {
            echo '## Firestore rules test output'
            echo '```'
            cat rules-test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^[0-9]+ passed, 0 failed' rules-test-output.txt; then
            echo "::error title=rules-output::suite failed or did not complete — output follows"
            tail -c 6000 rules-test-output.txt | sed 's/^/::error title=rules-output::/' || true
            exit 1
          fi

      - name: Post failure output as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=comment-step::running"
          BODY_FILE=$(mktemp)
          {
            echo "Firestore rules test run failed. Captured output (tail):"
            echo '```'
            tail -c 5000 firebase/rules-test-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } > "$BODY_FILE"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body=@"$BODY_FILE" \
            || echo "::error title=comment-step::gh api call failed (see annotations)"

  accounting:
    name: Accounting + api orchestration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run accounting core tests
        working-directory: mobile
        run: node test/accounting.test.js
      - name: Run api orchestration tests (mock Firestore)
        working-directory: mobile
        run: node test/api.mock.test.js
